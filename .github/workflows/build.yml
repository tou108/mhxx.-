name: APKのビルド
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          chmod +x gradlew
          sed -i 's/\r//' gradlew
          unset JAVA_OPTS
          unset JVM_OPTS
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: ""
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
