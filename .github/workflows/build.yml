name: APKのビルド
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle-wrapper.jar と gradlew を両方ダウンロードして修正
      - name: Fix Gradle wrapper
        run: |
          GRADLE_VERSION=8.4
          curl -L "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          curl -L "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}.0/gradlew" \
            -o gradlew

      - name: Build APK
        run: |
          chmod +x gradlew
          sed -i 's/\r//' gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: ""

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
